<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    <link rel="preload" as="image" href="/loader-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Umiya Travel Exclusive Car Rental & Travel Services — comfortable, reliable cars for local travel, outstation journeys, airport transfers and road trips."
    />
    <meta
      name="keywords"
      content="Umiya Travel, car rental, exclusive car rental, outstation travel, airport transfer, chauffeur driven, Ahmedabad"
    />
    <meta name="theme-color" content="#FF5F1F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Umiya Travel | Exclusive Car Rental & Travel Services</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #161616;
        color: #fff;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-loader__inner {
        display: flex;
        width: min(100%, 20rem);
        flex-direction: column;
        align-items: center;
        gap: clamp(0.85rem, 2.5vw, 1.25rem);
        padding: 0.5rem;
        text-align: center;
      }
      .boot-loader__mark {
        width: clamp(84px, 26vw, 132px);
        height: clamp(84px, 26vw, 132px);
        border-radius: clamp(14px, 4vw, 20px);
        overflow: hidden;
        background: #ff5f1f;
        box-shadow: 0 14px 42px rgba(255, 95, 31, 0.35);
      }
      .boot-loader__mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #ff5f1f;
      }
      .boot-loader__brand {
        margin: 0;
        font-family: Poppins, Manrope, sans-serif;
        font-size: clamp(0.95rem, 3.4vw, 1.15rem);
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .boot-loader__bar {
        width: clamp(88px, 28vw, 128px);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .boot-loader__bar > span {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: inherit;
        background: #ff5f1f;
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-busy="true" aria-label="Loading Umiya Travel">
      <div class="boot-loader__inner">
        <div class="boot-loader__mark">
          <img src="/loader-icon.png" alt="Umiya Travel" width="128" height="128" />
        </div>
        <p class="boot-loader__brand">Umiya Travel</p>
        <div class="boot-loader__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
